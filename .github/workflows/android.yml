name: Android CI - Debug & Release APK Build

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build Debug & Release APKs (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package no longer exists in Google's SDK
          # repository and makes sdkmanager exit 1, failing the whole job.
          # Only install packages that are actually published.
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses & Install API 36.1 / Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || sdkmanager "platform-tools" "platforms;android-36"

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Prepare Environment Configuration (.env)
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Inject google-services.json (if provided via GitHub Secret)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Decoding google-services.json from GitHub Secrets..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
          fi

      - name: Prepare Debug Keystore from Base64 or Keytool
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Verification Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoTactile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release Keystore & Signing Environment
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using configured GitHub Secrets for Release APK signing..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No production signing secrets found; generating ephemeral CI release keystore for automated Release APK verification..."
            CI_EPHEMERAL_PASS="ci_ephemeral_$(openssl rand -hex 12)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$CI_EPHEMERAL_PASS" \
              -alias upload \
              -keypass "$CI_EPHEMERAL_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=NeoTactile CI Release,OU=Mobile,O=NeoTactile,C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_EPHEMERAL_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoTactile-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to GitHub Releases (on Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          name: NeoTactile Chat Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Ephemeral Keystores
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          rm -f "${GITHUB_WORKSPACE}/debug.keystore"
